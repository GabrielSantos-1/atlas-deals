      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-atlas_redis_2024}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: atlas
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-atlas_rabbit_2024}
      SPRING_RABBITMQ_VIRTUAL_HOST: atlasdeals
      MANAGEMENT_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      SERVER_PORT: 8093
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - atlas-deals-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8093/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  image-generator:
    build:
      context: ../..
      dockerfile: backend/atlas-deals-image-generator/Dockerfile
    container_name: atlas-image-generator
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlasdeals
      SPRING_DATASOURCE_USERNAME: atlas
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas_secret_2024}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-atlas_redis_2024}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: atlas
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-atlas_rabbit_2024}
      SPRING_RABBITMQ_VIRTUAL_HOST: atlasdeals
      MANAGEMENT_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      SERVER_PORT: 8094
    volumes:
      - ./data/images:/app/data/images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - atlas-deals-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8094/actuator/health"]
