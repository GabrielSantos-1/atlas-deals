server:
  port: 8085

spring:
  application:
    name: atlas-deals-ai-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/atlasdeals
    username: atlas
    password: ${POSTGRES_PASSWORD:change_me_local_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: atlas
    password: ${RABBITMQ_PASSWORD:change_me_local_dev}
    virtual-host: atlasdeals
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2.0

  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:change_me_local_dev}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 4
        min-idle: 2

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.atlasdeals: DEBUG
    org.springframework.amqp: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

ai:
  provider: template
  model: gpt-4
  api-key: ${OPENAI_API_KEY:}
  max-tokens: 2000
  temperature: 0.7
  enabled-agents:
    - CONTENT_AGENT
    - SEO_AGENT

amqp:
  queue:
    promotion-detected: promotion.detected.q
    content-generated: content.generated.q
