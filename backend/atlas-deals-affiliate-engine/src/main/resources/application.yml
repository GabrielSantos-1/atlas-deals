server:
  port: 8084

spring:
  application:
    name: atlas-deals-affiliate-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/atlasdeals
    username: atlas
    password: ${POSTGRES_PASSWORD:change_me_local_dev}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: atlas
    password: ${RABBITMQ_PASSWORD:change_me_local_dev}
    virtual-host: atlasdeals

  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:change_me_local_dev}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

affiliate:
  default-campaign: atlas-deals
  shopee:
    partner-id: ""
  amazon:
    partner-tag: "atlasdeals-20"
    access-key: ""
    secret-key: ""
  mercadolivre:
    tool-id: ""
  kabum:
    partner-id: ""
  aliexpress:
    affiliate-tag: ""
