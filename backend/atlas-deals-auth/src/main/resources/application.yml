server:
  port: 8090
spring:
  application:
    name: atlas-deals-auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/atlasdeals
    username: ${DB_USER:atlas}
    password: ${DB_PASSWORD:change_me_local_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:change_me_local_dev}
app:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlX21lX2xvY2FsX2Rldl9qd3Rfc2VjcmV0X292ZXJyaWRlXzMyX2J5dGVz}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
