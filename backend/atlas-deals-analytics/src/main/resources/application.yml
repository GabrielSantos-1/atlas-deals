server:
  port: 8087

spring:
  application:
    name: atlas-deals-analytics

  datasource:
    url: jdbc:postgresql://localhost:5432/atlasdeals
    username: atlas
    password: ${POSTGRES_PASSWORD:change_me_local_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  rabbitmq:
    host: localhost
    port: 5672
    username: atlas
    password: ${RABBITMQ_PASSWORD:change_me_local_dev}
    virtual-host: atlasdeals
    connection-timeout: 5000
    template:
      retry:
        enabled: true
        initial-interval: 2000
        max-attempts: 3
        multiplier: 2.0

  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:change_me_local_dev}
    timeout: 2000
    lettuce:
      pool:
        max-active: 8
        max-idle: 4
        min-idle: 1

  cache:
    type: redis

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.atlasdeals: INFO
    org.springframework: WARN
    org.hibernate: WARN
