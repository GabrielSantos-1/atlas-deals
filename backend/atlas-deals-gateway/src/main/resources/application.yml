server:
  port: 8080
spring:
  application:
    name: atlas-deals-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:3000"
            allowed-methods: "*"
            allowed-headers: "*"
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:change_me_local_dev}
app:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlX21lX2xvY2FsX2Rldl9qd3Rfc2VjcmV0X292ZXJyaWRlXzMyX2J5dGVz}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  metrics:
    tags:
      application: ${spring.application.name}
